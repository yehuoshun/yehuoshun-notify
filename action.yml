name: yehuoshun Notify
description: 中英双语 GitHub 事件通知
author: yehuoshun

branding:
  icon: 'bell'
  color: 'blue'

inputs:
  webhook:
    description: 钉钉机器人 webhook 地址
    required: true
  event:
    description: 覆盖事件类型（用于 release 等场景），默认自动检测
    required: false
    default: ''
  max_commits:
    description: push 通知最多展示的 commit 条数（0=全部，默认显示全部）
    required: false
    default: '0'
  mention_users:
    description: 要 @ 的钉钉 userId（逗号分隔），需在钉钉管理后台查询
    required: false
    default: ''
  mention_mobiles:
    description: 要 @ 的手机号（逗号分隔），仅群内成员有效
    required: false
    default: ''
  mention_all:
    description: 是否 @ 所有人（true/false）
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Send DingTalk Notification
      shell: bash
      env:
        DINGTALK_WEBHOOK: ${{ inputs.webhook }}
        DINGTALK_EVENT: ${{ inputs.event }}
        DINGTALK_MAX_COMMITS: ${{ inputs.max_commits }}
        DINGTALK_MENTION_USERS: ${{ inputs.mention_users }}
        DINGTALK_MENTION_MOBILES: ${{ inputs.mention_mobiles }}
        DINGTALK_MENTION_ALL: ${{ inputs.mention_all }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GITHUB_EVENT_PATH: ${{ github.event_path }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
        GITHUB_ACTOR: ${{ github.actor }}
      run: python3 ${{ github.action_path }}/dingtalk-notify.py
